# Publishes the docs site to GitHub Pages: the docs app, the showcase (/showcase/), the component registry
# (/r/<name>.json for `npx shadcn add`, /files/<name>.tsx, /index.json) and /llms.txt. Runs on pushes to main and by
# hand. Before the first run: Settings → Pages → Source: GitHub Actions. Actions are pinned to full commit SHAs (the
# tag is in the comment; Dependabot keeps both up to date).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# one deployment at a time; a newer push waits instead of cancelling a deployment halfway
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs, showcase and registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build library, single files and registry
        env:
          REGISTRY_BASE_URL: ${{ steps.pages.outputs.base_url }} # r/*.json point at this site
        run: pnpm build
      - name: Check the registry
        run: pnpm test:registry
      - name: Build the site
        run: pnpm docs:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the artifact to Pages
      id-token: write # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
